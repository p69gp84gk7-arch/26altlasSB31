<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Dépannages – Fichier clients</title>
  <!--
    Redirection vers l'application (dossier web/).
    Utile seulement si GitHub Pages publie depuis la branche (Settings › Pages ›
    « Deploy from a branch ») ; avec « GitHub Actions », web/ est déjà la racine du site.
    La partie « #connexion=… » du lien de connexion est conservée.
  -->
  <script>location.replace('web/' + location.search + location.hash);</script>
</head>
<body>
  <p><a href="web/">Ouvrir l'application</a></p>
</body>
</html>
