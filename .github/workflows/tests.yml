name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests du serveur (chargeur + API)
        run: node --test tests/backend.test.js
      - name: Installation de Playwright
        run: |
          npm install --no-audit --no-fund
          # Sans --with-deps : les machines GitHub ont déjà les bibliothèques système
          # nécessaires, et l'installation des polices Ubuntu échoue parfois (réseau).
          npx playwright install chromium
      - name: Test de l'interface (navigateur)
        run: node --test tests/web.test.js
